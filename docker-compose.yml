version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vidente-postgres
    environment:
      POSTGRES_DB: vidente_db
      POSTGRES_USER: vidente_user
      POSTGRES_PASSWORD: vidente_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vidente-network

  redis:
    image: redis:7-alpine
    container_name: vidente-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vidente-network

volumes:
  postgres_data:
  redis_data:

networks:
  vidente-network:
    driver: bridge
